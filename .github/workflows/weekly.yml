name: Weekly DevOps Market Run

on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run the platform
        run: python scripts/orchestrator.py

      - name: Generate landing page
        run: python scripts/landing_page.py

      - name: Commit fresh data back to the repo
        run: |
          git config user.email "bot@orelbello.com"
          git config user.name  "DevOps Market Bot"
          git add reports/latest.json reports/index.html reports/report_*.md reports/linkedin_*.md data/history/*.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Weekly refresh: $(date -u +'%Y-W%V')"
            git push
          fi
