name: DevOps Market Run

# Schedule: Sun–Fri at 06:00 UTC = 09:00 IL (skip Saturday — Israeli market closed)
# Manual trigger always available via "Run workflow" in the Actions tab.
on:
  schedule:
    - cron: '7 6 * * 0,1,2,3,4,5'
  workflow_dispatch: {}

permissions:
  contents: write

# Prevent overlapping runs from pushing simultaneously
concurrency:
  group: devops-market-data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest remote state
        run: |
          git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # No pip install needed — platform is stdlib-only.

      - name: Run the main DevOps market platform
        run: python scripts/orchestrator.py

      - name: Run the junior pipeline
        run: python scripts/junior_orchestrator.py
        continue-on-error: true
        # junior pipeline can fail on LinkedIn rate limits without breaking the main run

      - name: Generate landing page
        run: python scripts/landing_page.py
        continue-on-error: true

      - name: Commit fresh data back to the repo
        shell: bash
        run: |
          git config user.email "bot@orelbello.com"
          git config user.name "DevOps Market Bot"

          # seen_jobs.json files MUST be committed so first-seen tracking survives across runs.
          git add reports/latest.json reports/jr_latest.json reports/index.html \
                  reports/report_*.md reports/linkedin_*.md \
                  reports/jr_report_*.md reports/jr_linkedin_*.md \
                  reports/devops-jobs-israel-*.xlsx \
                  reports/devops-juniors-israel-*.xlsx \
                  data/history/*.json \
                  data/seen_jobs.json data/seen_jr_jobs.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Refresh: $(date -u +'%Y-%m-%d')"

            # Push freshly rebased commit
            git push origin main
          fi
